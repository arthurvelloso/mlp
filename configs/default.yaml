# Hiperparâmetros e caminhos do projeto.
# Manter isso num arquivo (e não espalhado pelo código) deixa os
# experimentos reprodutíveis: muda aqui, commita, e dá para saber
# exatamente qual configuração gerou cada resultado.

seed: 0

data:
  val_size: 10000 # exemplos de validação separados dos 60 mil de treino

train:
  hidden_sizes: [256, 128] # MLP 784-256-128-10
  learning_rate: 0.1
  batch_size: 128
  epochs: 30
  patience: 5 # early stopping: épocas sem melhora na validação antes de parar
